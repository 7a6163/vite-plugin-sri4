name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test:coverage

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-report.junit.xml
          report_type: test_results

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          fail_ci_if_error: true

  compat:
    name: Vite ${{ matrix.vite }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        vite: ['6.4', '7.0', '8']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The peer range claims these majors; without this the only version ever
      # exercised is whatever devDependencies pins.
      - name: Install Vite ${{ matrix.vite }}
        run: npm i vite@${{ matrix.vite }} --no-save

      # Only test/sri.test.js drives a real vite build - the rest never touches
      # the installed Vite, so running it per version buys nothing.
      - name: Run Build Tests
        run: npx vitest run test/sri.test.js
